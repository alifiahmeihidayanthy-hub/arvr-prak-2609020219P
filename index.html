<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Ruang Perkenalan Diri</title>
 <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
 <a-scene>
 <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#C9B79C"></a-plane>
 <a-sky color="#A8D8F0"></a-sky>
  <a-box position="-2 0.5 -4" rotation="0 30 0" color="#E76F51"></a-box>
 <a-sphere position="0 1 -4" radius="0.8" color="#2A9D8F"></a-sphere>
 <a-cylinder position="2 0.75 -4" radius="0.5" height="1.5" color="#E9C46A"></a-cylinder>
 </a-scene>
</body>
</html>
